<!doctype html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Muhammad Khizar Bajwa — Portfolio</title>
  <meta name="robots" content="noindex,nofollow">

  <!-- Tailwind (CDN for dev). For production, compile locally. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ["class", "[data-theme='dark']"],
      theme: {
        fontFamily: { sans: ["Inter","ui-sans-serif","system-ui"] },
        extend: {
          colors: {
            brand: { 500:"#6366F1", 600:"#4F46E5", 700:"#4338CA" },
            night:  { 900:"#0b0c14", 800:"#0f1222", 700:"#11142a", 600:"#121535" }
          },
          boxShadow: {
            glass: "0 1px 0 rgba(255,255,255,.04) inset, 0 10px 30px rgba(2,6,23,.35)",
            glow:  "0 0 0 1px rgba(99,102,241,.25), 0 10px 30px rgba(99,102,241,.25)"
          },
          backdropBlur: { xs:"2px" }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* Fluxon-style dark gradient + subtle grid */
    .hero-bg{
      background:
        radial-gradient(90rem 50rem at 80% -10%, rgba(79,70,229,.35), transparent 60%),
        radial-gradient(70rem 40rem at -10% 0%, rgba(168,85,247,.25), transparent 60%),
        linear-gradient(180deg, #12163b 0%, #0d1028 55%, #0b0c14 100%);
      position: relative;
      overflow: hidden;
    }
    .grid-mask{
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48' viewBox='0 0 48 48'><path d='M48 0H0v48' fill='none' stroke='rgba(255,255,255,.05)'/></svg>");
      background-size:48px 48px;
      background-repeat:repeat;
      mask-image:linear-gradient(to bottom, rgba(0,0,0,.7), rgba(0,0,0,.2));
      -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,.7), rgba(0,0,0,.2));
    }
    .glass{
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      box-shadow:0 0 0 1px rgba(255,255,255,.02) inset, 0 10px 30px rgba(0,0,0,.35);
      backdrop-filter: blur(8px);
    }
    .chip{background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08)}

    /* Decorative orbits behind hero */
    .orbits { position: absolute; inset: -120px -60px auto auto; width: 640px; height: 640px; pointer-events: none; }
    .orbit-ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.08);
      transform-origin: 50% 50%;
    }
    .orbit-ring.r1 { width: 100%; height: 100%; }
    .orbit-ring.r2 { width: 80%; height: 80%; inset: 10%; }
    .orbit-ring.r3 { width: 60%; height: 60%; inset: 20%; }
    .orbit-dot {
      position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; border-radius: 999px;
      background: rgba(99,102,241,.95); box-shadow: 0 0 0 2px rgba(99,102,241,.25), 0 8px 24px rgba(99,102,241,.35);
      transform-origin: -220px 0;
    }
    .orbit-dot.d1 { transform-origin: -220px 0; }
    .orbit-dot.d2 { transform-origin: -170px 0; background: rgba(168,85,247,.95); }
    .orbit-dot.d3 { transform-origin: -120px 0; background: rgba(59,130,246,.95); }

    /* Angled wipe utility for section headers */
    .angled-wrap { position: relative; overflow: hidden; }
    .angled-wipe {
      position: absolute; left: -10%; top: -40px; width: 120%; height: 140px;
      background: linear-gradient(90deg, rgba(99,102,241,.18), rgba(168,85,247,.14), transparent 70%);
      transform: rotate(-3deg) translate3d(0,0,0);
      opacity: 0; pointer-events: none; filter: blur(0.3px);
    }

    /* Parallax helpers */
    [data-parallax]    { will-change: transform; }
    [data-parallax="y"]{ transform: translateY(0); }
    [data-parallax="x"]{ transform: translateX(0); }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .orbit-ring, .orbit-dot, .angled-wipe, [data-parallax] { transition: none !important; animation: none !important; }
    }
  </style>
</head>

<body class="bg-night-900 text-white antialiased" data-theme="dark">
  <div id="app"></div>

  <!-- Vue -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <!-- GSAP + ScrollTrigger -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <!-- App (modules) -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
